name: pr

# Isolated contribution check: untrusted fork code builds and tests here with
# no organization secrets and no self-hosted runner. Runs only on
# pull_request (never pull_request_target), on GitHub-hosted runners, with a
# read-only token. Release stays on release.yml (tags + manual dispatch).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      # Vendor/ is pinned upstream content, not ours to format: gate only
      # the module's own packages (go list excludes vendor dirs).
      - run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -count=1 ./...
